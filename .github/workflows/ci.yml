name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its older runs. On main, a waiting run gives way to a newer one,
# and the running one finishes so Release still sees a completed CI run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace --locked --no-fail-fast
      - name: extension tests on the Node backend
        run: cargo test -p pi-coding-agent --test extensions --locked --no-fail-fast
        env:
          PI_EXTENSION_RUNTIME: node

  install-scripts:
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
