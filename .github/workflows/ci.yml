name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trust_store_oracle:
        description: Only generate Windows ProjectTrustStore goldens
        type: boolean
        default: false

# A new push to a PR cancels its older runs. On main, a waiting run gives way to a newer one,
# and the running one finishes so Release still sees a completed CI run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}${{ inputs.trust_store_oracle && github.ref != 'refs/heads/main' && '-trust-oracle' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.trust_store_oracle || github.ref == 'refs/heads/main' }}
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Saves a macOS job: GitHub runs at most 5 at once.
      - if: runner.os == 'macOS'
        run: sh scripts/test-install.sh

  # Each shard builds every test and runs one nextest slice. A shared nextest archive would add an
  # upload and a download to the slowest job. Shard counts aim at under 10 minutes per job.
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.trust_store_oracle || github.ref == 'refs/heads/main' }}
    name: test (${{ matrix.os }}, ${{ matrix.kind && format('{0} ', matrix.kind) || '' }}${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, shards: 4 }
          - { os: ubuntu-latest, shard: 2, shards: 4 }
          - { os: ubuntu-latest, shard: 3, shards: 4 }
          - { os: ubuntu-latest, shard: 4, shards: 4 }
          # macOS splits by target: each runner compiles one of the two large pi-coding-agent units
          # (lib unit tests 3.7 GB, lib plus integration tests 2.8 GB) on 3 CPUs and 7.5 GB.
          - { os: macos-latest, kind: unit, targets: --workspace --exclude pi-evals --lib, shard: 1, shards: 1, node: none }
          - { os: macos-latest, kind: integration, targets: "--workspace --bins --test '*'", shard: 1, shards: 2, node: none }
          - { os: macos-latest, kind: integration, targets: "--workspace --bins --test '*'", shard: 2, shards: 2, node: all }
          - { os: windows-latest, shard: 1, shards: 6 }
          - { os: windows-latest, shard: 2, shards: 6 }
          - { os: windows-latest, shard: 3, shards: 6 }
          - { os: windows-latest, shard: 4, shards: 6 }
          - { os: windows-latest, shard: 5, shards: 6 }
          - { os: windows-latest, shard: 6, shards: 6 }
    env:
      # x86_64 Linux links with rust-lld by default (Rust 1.90); the MSVC target uses link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - name: Free Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h .
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          df -h .
      - uses: dtolnay/rust-toolchain@stable
      # The shards of one OS share a cache key, so one of them saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.shard == 1 && matrix.kind != 'unit' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: record the macOS host and sample memory every 30s
        if: runner.os == 'macOS'
        run: |
          sysctl machdep.cpu.brand_string hw.ncpu hw.memsize
          nohup vm_stat 30 > "$RUNNER_TEMP/vm_stat.log" 2>&1 &
      # nextest gives each test its own process. Without PI_ENV_DAEMON, each pi-env test process runs
      # cargo build, which relinks the daemon while another test starts it.
      - run: cargo build --workspace --locked --bin pi-env
      # nextest runs the tests of every binary in parallel; .config/nextest.toml lists the
      # binaries with their own main, which run with cargo test.
      - run: >-
          cargo nextest run ${{ matrix.targets || '--workspace' }} --locked --profile ci
          --partition slice:${{ matrix.shard }}/${{ matrix.shards }}
        env:
          PI_ENV_DAEMON: ${{ github.workspace }}/target/debug/pi-env${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: memory during the build and tests
        if: always() && runner.os == 'macOS'
        run: |
          memory_pressure -Q
          cat "$RUNNER_TEMP/vm_stat.log"
      - name: tests with their own harness
        if: matrix.shard == 1 && matrix.kind != 'unit'
        run: >-
          cargo test --workspace --locked --no-fail-fast --test chord2_manager_child --test node_fork
          --test node_cluster --test node_ipc_missing_handle --test node_ipc_recovery
          --test node_ipc_windows_diag --test node_ipc_cloexec
      - if: matrix.shard == 1 && matrix.kind != 'unit'
        run: cargo test --workspace --doc --locked --no-fail-fast
      # The same target selection as the nextest step above, so nothing is rebuilt. On macOS the
      # Node tests run unsliced on one shard: slicing them did not shorten the step.
      - name: extension and SDK tests on the Node backend
        if: matrix.node != 'none'
        run: >-
          cargo nextest run ${{ matrix.targets || '--workspace' }} --locked --profile ci
          ${{ matrix.node != 'all' && format('--partition slice:{0}/{1}', matrix.shard, matrix.shards) || '' }}
          -E "package(pi-coding-agent) & binary(=integration)
          & test(/^(extensions|tui_viewport_exports|project_trust_store_exports|sdk_child_session|sdk_session|sdk_settings_replay|sdk_settings_child|sdk_resources|sdk_model_runtime|sdk_storage|sdk_utilities)::/)"
        env:
          PI_EXTENSION_RUNTIME: node

  install-scripts:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.trust_store_oracle || github.ref == 'refs/heads/main' }}
    name: install scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

  project-trust-store-oracle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.trust_store_oracle && github.ref != 'refs/heads/main' }}
    env:
      UPSTREAM_PIN: 35dfa757378bd7a8570670e99c2687bdd1039a06
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # Byte-exact upstream sources, so the recorded sha256 values match the pin.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: pi-rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: ${{ env.UPSTREAM_PIN }}
          path: pi-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only the packages of upstream's own lock file, without their install scripts.
      - name: Install upstream's locked packages
        working-directory: pi-upstream
        run: npm ci --ignore-scripts
      - name: Check upstream is at the pin and unchanged
        working-directory: pi-upstream
        run: |
          test "$(git rev-parse HEAD)" = "$UPSTREAM_PIN"
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Generate the Windows goldens
        run: node pi-rust/scripts/project-trust-store-scenario.mjs pi-upstream --temp-parent "$RUNNER_TEMP"
      - name: Record provenance
        run: |
          fixtures=pi-rust/crates/pi-coding-agent/tests/fixtures/extensions
          if grep -l '"_status"' "$fixtures"/project_trust_store_*.win32.json "$fixtures"/project_trust_store_windows_scenario.json; then
            echo "a placeholder was not replaced" >&2
            exit 1
          fi
          test "$(git -C pi-upstream rev-parse HEAD)" = "$UPSTREAM_PIN"
          git -C pi-upstream diff --exit-code HEAD --
          test -z "$(git -C pi-upstream status --porcelain --untracked-files=all)"
          {
            echo "pi-rust $(git -C pi-rust rev-parse HEAD)"
            echo "upstream $(git -C pi-upstream rev-parse HEAD) (pin $UPSTREAM_PIN)"
            echo "upstream tracked files unchanged after npm ci and generation: git diff --exit-code HEAD and status --porcelain empty"
            echo "node $(node --version)"
            echo "npm $(npm --version)"
            echo "runner ${RUNNER_OS} ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            sha256sum pi-rust/scripts/project-trust-store-scenario.mjs pi-upstream/package-lock.json \
              "$fixtures"/project_trust_store_scenario.mjs "$fixtures"/project_trust_store_windows_scenario.mjs \
              "$fixtures"/project_trust_store_exit.mjs "$fixtures"/project_trust_store_scenario.win32.json \
              "$fixtures"/project_trust_store_windows_scenario.json "$fixtures"/project_trust_store_exit.win32.json
          } > provenance.txt
          cat provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: project-trust-store-windows-goldens
          if-no-files-found: error
          path: |
            provenance.txt
            pi-rust/crates/pi-coding-agent/tests/fixtures/extensions/project_trust_store_scenario.win32.json
            pi-rust/crates/pi-coding-agent/tests/fixtures/extensions/project_trust_store_windows_scenario.json
            pi-rust/crates/pi-coding-agent/tests/fixtures/extensions/project_trust_store_exit.win32.json
