name: Parity

# Daily gap report against upstream pi. See docs/parity/README.md.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: parity
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Upstream does not commit its model data. This job runs upstream's npm scripts, so it gets
  # no write permissions and no stored credentials. Without its artifact the report skips the
  # model catalog.
  model-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate upstream model data
        run: |
          npm ci --ignore-scripts
          npm run hydrate-model-data -w packages/ai
      # Input for `cargo xtask models <dir>`, which regenerates crates/pi-ai/models.json.
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-model-data
          path: packages/ai/src/providers/data
          if-no-files-found: error

  report:
    needs: model-data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # Full history: the report finds ported commits by their messages.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: upstream-model-data
          path: upstream/packages/ai/src/providers/data
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parity report
        run: cargo xtask parity --upstream upstream --out parity-report.md

      - name: CI and release health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          if failed=$(gh run list -R "$REPO" -b main -L 50 --json name,conclusion,createdAt,url \
            --jq ".[] | select(.createdAt >= \"$since\" and .conclusion == \"failure\") | \"- \(.name): \(.url)\""); then
            failed=${failed:-- none}
          else
            failed="- could not list the runs"
          fi
          tag=$(gh release list -R "$REPO" -L 1 --json tagName --jq '.[0].tagName')
          assets=$(gh release view "$tag" -R "$REPO" --json assets --jq '.assets | length')
          {
            echo
            echo "## CI and release health"
            echo
            echo "Failed runs on main since $since:"
            echo
            echo "$failed"
            echo
            echo "Latest release $tag has $assets assets (expected 9)."
          } >> parity-report.md

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: parity-report
          path: parity-report.md
          if-no-files-found: ignore

      - name: Update the parity-report issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f parity-report.md ] || echo "The parity report did not run. See the run log." > parity-report.md
          gh label create parity-report -R "$REPO" --color 5319e7 \
            --description "Daily upstream parity report" --force
          {
            echo "Updated by [this run]($RUN_URL). Playbook: docs/parity/README.md."
            echo
            # Issue bodies hold 65536 characters. Cut at a line end.
            LC_ALL=C awk '{ size += length($0) + 1; if (size > 60000) { print "\n(Truncated. The full report is in the parity-report artifact.)"; exit } print }' parity-report.md
          } > issue-body.md
          issue=$(gh issue list -R "$REPO" -l parity-report -s open --author app/github-actions -L 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" -R "$REPO" --body-file issue-body.md
          else
            gh issue create -R "$REPO" -l parity-report \
              --title "Upstream parity report" --body-file issue-body.md
          fi
