name: Release

# Releases run after CI passes on main: conventional commits since the last tag decide
# the next semantic version. Pushing a `v*` tag releases that exact version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths: [".github/workflows/release.yml", "xtask/**", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Build every target without tagging or publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.mode.outputs.publish }}
      ref: ${{ steps.commit.outputs.ref || steps.mode.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Plan version
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            cargo xtask check-tag "$REF_NAME"
            version="${REF_NAME#v}"
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
            printf 'release=true\nversion=%s\ntag=%s\nprerelease=%s\n' "$version" "$REF_NAME" "$prerelease" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            version="$(cargo xtask plan | sed -n 's/^version=//p')"
            printf 'release=true\nversion=%s\ntag=v%s\nprerelease=false\n' "${version:-0.0.0}" "${version:-0.0.0}" >> "$GITHUB_OUTPUT"
          else
            cargo xtask plan --bump "$BUMP" --github-output
          fi
      - name: Decide whether to publish
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          publish=false
          case "$EVENT" in
            push) publish=true ;;
            workflow_run) publish="$RELEASE" ;;
            workflow_dispatch) [ "$DRY_RUN" = false ] && [ "$REF" = refs/heads/main ] && publish="$RELEASE" ;;
          esac
          if [ "$publish" = true ] && [ "$EVENT" != push ]; then
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "main moved past $(git rev-parse --short HEAD); the next CI run on main releases it."
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Commit version and tag
        id: commit
        if: steps.mode.outputs.publish == 'true' && github.event_name != 'push'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo xtask prepare "$VERSION"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Put clang on PATH for ring
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p pi-coding-agent -p pi-env-daemon --target ${{ matrix.target }}
          elif [ "${{ runner.os }}" = Windows ]; then
            cargo build --release --locked -p pi-coding-agent --target ${{ matrix.target }}
            # Static C runtime, so the daemon needs no Visual C++ redistributable on the remote machine (as upstream).
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p pi-env-daemon \
              --target ${{ matrix.target }} --target-dir target-daemon
          else
            cargo build --release --locked -p pi-coding-agent -p pi-env-daemon --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="pi-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "dist/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/$TARGET/release/pi.exe" "dist/$name/"
            (cd dist && 7z a -tzip -bso0 "$name.zip" "$name")
          else
            cp "target/$TARGET/release/pi" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - name: Package the pi-env daemon
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Folder names follow pi-env's packaged_daemon: pi-env-<platform>-<arch>. Upstream has no 32-bit ARM remote.
          case "$TARGET" in
            x86_64-unknown-linux-musl) remote=linux-x64 ;;
            aarch64-unknown-linux-musl) remote=linux-arm64 ;;
            x86_64-apple-darwin) remote=darwin-x64 ;;
            aarch64-apple-darwin) remote=darwin-arm64 ;;
            x86_64-pc-windows-msvc) remote=windows-x64 ;;
            aarch64-pc-windows-msvc) remote=windows-arm64 ;;
            *) exit 0 ;;
          esac
          mkdir -p "daemon/pi-env-$remote"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target-daemon/$TARGET/release/pi-env.exe" "daemon/pi-env-$remote/"
          else
            cp "target/$TARGET/release/pi-env" "daemon/pi-env-$remote/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target != 'armv7-unknown-linux-musleabihf'
        with:
          name: daemon-${{ matrix.target }}
          path: daemon/*
          if-no-files-found: error

  android-daemons:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    name: daemon (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android, name: android-arm64, clang: aarch64-linux-android24 }
          - { target: x86_64-linux-android, name: android-x64, clang: x86_64-linux-android24 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure the Android NDK linker
        # A fixed NDK, installed when the runner image does not have it (as upstream's env-daemons workflow).
        env:
          NDK_VERSION: 27.2.12479018
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}-clang"
          test -x "$linker"
          variable="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$variable=$linker" >> "$GITHUB_ENV"
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=$linker" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p pi-env-daemon --target ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p "daemon/pi-env-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/pi-env" "daemon/pi-env-${{ matrix.name }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: daemon/*
          if-no-files-found: error

  publish:
    needs: [plan, build, android-daemons]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: daemons/pi-env-daemons
          merge-multiple: true
      - name: Package the pi-env daemons
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          find daemons -type f -name pi-env -exec chmod +x {} +
          tar -C daemons -czf "dist/pi-env-daemons-$TAG.tar.gz" pi-env-daemons
          tar -tzf "dist/pi-env-daemons-$TAG.tar.gz"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if cargo xtask notes "$VERSION" > notes.md; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --verify-tag "${flags[@]}"
          fi
