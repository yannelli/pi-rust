[workspace]
resolver = "3"
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-codemode",
    "crates/pi-coding-agent",
    "crates/pi-mcp",
    "crates/pi-tui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yannelli/pi-rust"
rust-version = "1.85"

[workspace.dependencies]
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
base64 = "0.22"
tempfile = "3"
crc32fast = "1"
ruzstd = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
