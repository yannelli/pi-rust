# Config for `cargo about generate`, which writes THIRD-PARTY-LICENSES.md for the release
# archives. For a crate with a choice of licenses, the first accepted one in this list is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "0BSD",
    "CC0-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
