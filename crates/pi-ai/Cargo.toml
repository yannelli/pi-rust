[package]
name = "pi-ai"
description = "Unified streaming LLM API for the pi agent harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# Development OAuth login helper (upstream `pi-ai` CLI); the release builds only `pi`.
[[bin]]
name = "pi-ai"
path = "src/bin/pi-ai.rs"

# Scripted ACP agent for tests/acp_agent.rs.
[[bin]]
name = "fake-acp-agent"
path = "tests/support/fake_acp_agent.rs"
test = false
doc = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
regex = "1.11.1"
crc32fast.workspace = true
pi-schema.workspace = true
pi-telemetry.workspace = true
futures.workspace = true
reqwest.workspace = true
ring.workspace = true
ruzstd.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
