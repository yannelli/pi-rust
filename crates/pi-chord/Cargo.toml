[package]
name = "pi-chord"
description = "Application composition runtime for services, replicated state, RPC, and plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Load JavaScript facet bundles through the embedded QuickJS runtime.
js = ["dep:pi-js"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
indexmap = "2"
pi-js = { path = "../pi-js", optional = true }
ring.workspace = true
ryu = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
