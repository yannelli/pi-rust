[package]
name = "pi-chord"
description = "Application composition runtime for services, replicated state, RPC, and plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Bundle JavaScript facets with oxc and load them through the embedded QuickJS runtime.
js = ["dep:pi-js", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
flate2 = "1"
futures.workspace = true
indexmap = "2"
oxc_allocator = { version = "0.153.0", optional = true }
oxc_ast = { version = "0.153.0", optional = true }
oxc_parser = { version = "0.153.0", optional = true }
oxc_semantic = { version = "0.153.0", optional = true }
oxc_span = { version = "0.153.0", optional = true }
pi-js = { path = "../pi-js", optional = true }
pi-schema.workspace = true
pi-telemetry.workspace = true
ring.workspace = true
ryu = "1"
serde.workspace = true
# JSON.parse rounds numbers correctly; serde_json does so only with float_roundtrip.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util", "net", "process"] }
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "stdio"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

# Its own harness: the test binary is also the child host it spawns (see the file).
[[test]]
name = "chord2_manager_child"
harness = false

[lints]
workspace = true
