[package]
name = "pi-js"
description = "Embedded QuickJS runtime with TypeScript loading and Node compatibility for pi extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
futures.workspace = true
reqwest.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
md-5 = "0.10.6"
notify = "8.2.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
oxc_allocator = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_sourcemap = "9.0.0"
oxc_span = "0.153.0"
oxc_transformer = "0.153.0"
unicode-segmentation = "1.12"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# rquickjs-sys ships pregenerated bindings for every release target except armv7 musl.
[target.'cfg(not(all(target_arch = "arm", target_env = "musl")))'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader"] }

[target.'cfg(all(target_arch = "arm", target_env = "musl"))'.dependencies]
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "loader", "bindgen"] }

[dev-dependencies]
tempfile.workspace = true

# Same lints as the workspace, except `unsafe_code` is `deny` instead of `forbid`: the
# system-call module (`node/sys.rs`) allows it locally, as libuv's calls need FFI.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Forked children run this test binary, so it needs its own main.
[[test]]
name = "node_fork"
harness = false
